[project]
name = "chipformer"
version = "0.1.0"
description = "A hand-constructed transformer that executes CHIP-8 programs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
play = ["pygame>=2.5"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
hf = [
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "eth-abi>=6.0.0",
    "eth-hash[pycryptodome]>=0.8.0",
    "eth-utils>=6.0.0",
    "pillow>=12.3.0",
    "py-evm>=0.12.1b1",
    "py-solc-x>=2.1.0",
    "pytest>=8",
    "ruff>=0.6",
    "tokenizers==0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
